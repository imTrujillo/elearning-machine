server:
  port: 8081

spring:
  application:
    name: learning-engine
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 600000



wordpress:
  base-url: ${WORDPRESS_URL}
  username: ${WORDPRESS_USERNAME}
  password: ${WORDPRESS_PASSWORD}

woocommerce:
  consumer-key: ${WOO_CONSUMER_KEY}
  consumer-secret: ${WOO_CONSUMER_SECRET}

rabbitmq:
  exchanges:
    enrollments: enrollments.exchange
    modules: modules.exchange
  queues:
    enrollment-activated: enrollment.activated.queue
    module-completed: module.completed.queue
  routing-keys:
    enrollment-activated: enrollment.activated
    module-completed: module.completed

